image: alpine/edge
triggers:
- action: email
  condition: failure
  to: srhtbuilds@k6.tel
oauth: pages.sr.ht/PAGES:RW
packages:
- hut
environment:
  site: millennium.k6.tel
tasks:
- package: |
    cd bttj-millennium-edition
    tar -cvz -X EXCLUDED-BUILD-FILES.txt . > ~/site.tar.gz
- upload: |
    hut pages publish -d $site ~/site.tar.gz

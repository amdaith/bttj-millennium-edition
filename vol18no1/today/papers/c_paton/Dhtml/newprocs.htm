function workDiaRef() {
var iObj,w,x,i,y,z,lnk,lText;
wOldID=wSelID;
for (i=1; i<13; i++) {
 nDisp[i]=0
 };
clearArrows();
iObj=window.pmap.document.all;
x=inLinks.length;
for (i=0; i<x; i++) {
 inLinks[i]=0			//clear input links
 };
ilCount=1;
x=outLinks.length;
for (i=0; i<x; i++) {
 outLinks[i]=0			//clear output links
 };
olCount=1;
lnk=wLinks[wSelID];
if (lnk!=0) {
 links=lnk.split(",");
 x=tName.length
 written=new Array();
 for (i=0; i<x; i++) {
  written[i]=0
  };
 iIn=new Array();		//flag for io
 iOut=new Array();
 teams=new Array();		//create array of connected teams
 teams[0]=0;
 iIn[0]=0;
 iOut[0]=0;
 x=links.length;
 w=1;
 for (i=1; i<x; i++) {
  if (tlTo[links[i]]==tSelID) {
   inLinks[ilCount++]=links[i];
   z=tlFrom[links[i]];
   if (written[z]!=1) {
    written[z]=1;
    };
   iIn[z]=1
   };
  if (tlFrom[links[i]]==tSelID) {
   outLinks[olCount++]=links[i];
   z=tlTo[links[i]];
   if (written[z]!=1) {
    written[z]=1;
    };
   iOut[z]=1
   }
  };
 clearArrows();
 y=1;
 x=13;
 for(i=1; i<x; i++) {
  nDisp[i]=0
  };
 x=tName.length;
 for(i=1; i<x; i++) {
  if (written[i]==1 && y<13) {
   if (iIn[i]==1) dispArrow(y,"I");
   if (iOut[i]==1) dispArrow(y,"O");
   nDisp[y++]=i
   }
  };
 };
disSel();
refreshDisp();
if (start==true) {
 comCo=0;
 if (tSelID==0 || tSelID==slT[nSL[wStart[wSelID]]] || inWork==false) goFwd(wStart[wSelID],false)
 else {
  window.nav.document.all("wstart").style.visibility="visible";
  if (tOldID==0) tOldID=slT[nSL[wStart[wSelID]]];
  disInLinks(tOldID) 
  }
 }
}

function workDet() {
var i,w,x,y,l,link,links,sObj;
found=new Boolean(0);
l=getT(nDia[nSelID]);
if (l=="I") {
 sObj=window.pmap.document.all;
 restoreDia();
 x=nSelID;
 y=slT[nSL[x]];
 if (y!=tSelID) {
  tSelID=y;
  start=false;
  workDiaRef()
  };
 if (nLogic[x]=="U") {			//UOB
  link="";
  if (nDesc[x]==1) link=sObj("ND"+x).innerText;
  y=nProc[x];
  getHead(y,"H","N",x,link);
  if (y==1) sObj("XH"+x).innerHTML=sObj("NP"+x).innerHTML
  };
 if ("XOA".indexOf(nLogic[x])!=-1) {	//junction
  link="";
  w=nIL[x].split(",")
  if (nLogic[x]=="A" && w.length>2) {	//fan-in and
   link="All these done?:"+getInLinks(nIL[x]);
   sObj("detail").insertAdjacentHTML("BeforeEnd",link)
   }
  else {
   if (nDesc[x]==1) link=sObj("ND"+x).innerText;
   if (nLogic[x]=="X" && w.length<=2) getHead(0,"H","N",x,link);
   link="To:";
   y=nLogic[x];
   if (y=="X") link="Choose one of:";
   if (y=="O") link="Do these as necessary:";
   if (y=="A") link="Do all of:";
   link=getOutLinks(nOL[x],link);
   sObj("detail").insertAdjacentHTML("BeforeEnd",link)
   }
  }
 };
return l
}

 };

 };

 dDoc=window.pmap.document.all("Data");
 loadingT=false;

 dDoc.insertAdjacentHTML("AfterBegin",lText);

 lText=win.document.all("D"+what).outerHTML;

 };

 v=1;

 if (u!=tSelID) {

 else {

function goFwd(n_ID,cont) {
var lText,tx,ty,l,i,t,u,v,w,x,y,z,aw,ax,ay,az;
list=false;
found=new Boolean(0);
x=n_ID;
nSelID=x;
tOldID=tSelID;
written=new Array();
lText="Workflow: "+wName[wSelID];
if(tSelID!=0) window.pmap.document.all("detailhead").innerText=tName[tSelID];
disSel();
stop=new Boolean(0);
if (cont!=true || start==true) {
 window.pmap.document.all("detail").innerHTML="";
 hSelID=x
 };
while (stop==false && written[x]!=1) {
 if (nLogic[x]=="C") {
  l=nOL[x].split(",");
  if (l.length==2) {		//fanin "C"
   comstack[comCo++]=lastDia;
   x=lTo[l[1]]
   }
  else {			//fanout "C"
   comCo--;
   t=comstack[comCo];
   u=l.length;
   found=false;
   v=1;
   while(v<u && (found==false)) {
    x=lTo[l[v++]];
    if (t==nDia[x]) found=true;
    }
   }
  };
 nSelID=x;
 written[x]=1;
 tx=nOL[x];
 ty=tx.split(",");
 z=ty.length;
 y=nLogic[x];
 if (z==2) {
  aw=slW[nSL[x]];			//get work flows
  ax=aw.split(",");
  ay=ax.length;
  az=1;
  found=false;
  while (az<ay && found==false) {
   if (ax[az++]==wSelID) found=true
   };
  if (found==false) {
   if (histGo==false) {
    stop=true;
    lText="<DIV ID=LX"+x+" class=andlink>";
    lText=lText+"Click to follow the: "+wName[ax[1]]+" workflow?</DIV>\n\r";
    window.pmap.document.all("detail").insertAdjacentHTML("BeforeEnd",lText)
    }
   }
  };
 if (stop==false) {
  if (((y=="X" || y=="O") && z<=2 || y=="C")!=true) l=workDet()
  else l="I";
  if (l=="I") {
   start=false;
   window.nav.document.all("wstart").style.visibility="visible";
   if (z!=2) stop=true;
   if (stop!=true) {
    w=nIL[x].split(",")
    if (nLogic[x]=="A" && w.length>2) {	//fan-in and
     stop=true;
     lText="<DIV ID=LO"+lTo[ty[1]]+" class=andlink>";
     lText=lText+"Yes</DIV>\n\r";
     window.pmap.document.all("detail").insertAdjacentHTML("BeforeEnd",lText)
     }   
    else {
     w=ty[1];
     u=slT[nSL[lTo[w]]];
     if (u!=slT[nSL[x]]) {
      stop=true;
      l=tName[u];
      lText="<DIV ID=LO"+lTo[w]+" class=farlink>";
      lText=lText+lName[w]+"  .... to "+l+"</DIV>\n\r";
      window.pmap.document.all("detail").insertAdjacentHTML("BeforeEnd",lText);
      redBox(u)
      }
     }
    };
   if(nLogic[x]!="C") lastDia=nDia[x];
   x=lTo[ty[1]]
   }
  else stop=true
  }
 }
}

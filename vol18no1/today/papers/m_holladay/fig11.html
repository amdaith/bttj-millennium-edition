<!-- URL's used in the movie--> <!-- text used in the movie--> <!--Today Sales and Order Processing and Service Resourcing are both highly external. Sales and Order Processing is also highly interactive with the other activities.  Others such as Service- Resource Management have little interaction with others and is a very internal activity. In the future there is a general trend towards increased externalisation and higher levels of interaction with  other Operational Support activities. Today, activities like Chargeable Event Collection are always going on but are very routine whilst business  management has a long time-constant to the activity and is very complex.Highly complex and high  frequency activities are not desirable and not suited to OS support. In the future there is a general trend towards less complex operation, activities becoming more routine and  more automated.  Sales and Order Processing will be simpler and for infrastructural roles like the Access  Connector less frequent. However the Quality Assurance activity is likely to become more complex and be a  more adaptive activity as personalisation and tailoring develops within the culture. The move towards more proactive behaviour will be driven by market cause and a move in customer  expectation for instant reply and 'I want things ready when I am' provide this.  There is a general trend  towards more proactivity, initiating the activity in advance of requests.  In addition activities related to Billing  (CEC and AcC) are also likely to be more visible to customers. All the activities are valued within present Public Network Operators.  But activities like Business  Management, Service-Resource Management, Service Resourcing and Chargeable Event Collection have  less value to other enterprises and players. In the future, Service Resourcing and Business Management will be more important to others because of  the need for players to co-operate and as they realise they are dependent on each other.  Service-Resource  Management also becomes more important to others as faults become less acceptable and faster 'fixing'  (possibly through purchase and deployment of automatic re-routing technologies) times are expected. -->
